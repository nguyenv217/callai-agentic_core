[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callai-agentic_core-brokers"
version = "0.1.0"
description = "Distributed task queue brokers for agentic_core"
requires-python = ">=3.10"
dependencies = [
    "callai-agentic_core>=0.6.6"
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_core_brokers"]