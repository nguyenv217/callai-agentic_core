[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callai-agentic_core-persistence"
version = "0.1.0"
description = "Official persistence providers for agentic_core"
requires-python = ">=3.10"
dependencies = [
    "callai-agentic_core>=0.6.6",
    "aiosqlite"
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_core_persistence"]