[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callai-agentic_core-shell"
version = "0.1.0"
description = "Shell execution tools for callai-agentic_core"
requires-python = ">=3.10"
dependencies = [
    "callai-agentic_core>=0.6.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_core_shell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
